<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1b2433" flood-opacity="0.12"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1b2433" flood-opacity="0.10"/></filter>
</defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
<rect width="1100" height="380" fill="#eef1f6"/>
<rect x="36" y="30" width="472" height="300" rx="18" fill="#ffffff" stroke="#e1e4ea" filter="url(#shadow)"/>
<text x="64" y="70" font-size="15" font-weight="700" fill="#1f2329">Before</text><text x="64" y="90" font-size="11.5" fill="#8b919c">reading near the bottom</text>
<line x1="36" y1="108" x2="508" y2="108" stroke="#eef0f4"/>
<rect x="54" y="124" width="22" height="22" rx="7" fill="#f59e0b"/><text x="65" y="139" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">2</text>
<text x="86" y="139" font-size="11.5" fill="#8b919c">target is above the viewport</text>
<rect x="54" y="158" width="426" height="48" rx="8" fill="#f7f8fb" stroke="#eef0f4"/>
<text x="72" y="180" font-size="11.5" fill="#9aa1ad">... an earlier pinned block ...</text>
<text x="72" y="196" font-size="10.5" fill="#b3b8c1">clipped at the top edge</text>
<text x="64" y="244" font-size="12.5" fill="#5f6672">Long answers keep growing below the pin.</text>
<text x="64" y="268" font-size="12.5" fill="#5f6672">The reader is here, at the newest output.</text>
<rect x="54" y="286" width="426" height="28" rx="8" fill="#fff7e8"/>
<text x="70" y="305" font-size="11.5" fill="#b45309">pin 2 is one click away in the panel</text>
<rect x="300" y="118" width="192" height="34" rx="10" fill="#ffffff" stroke="#e3e6ec" filter="url(#soft)"/>
<rect x="310" y="126" width="18" height="18" rx="6" fill="#fff2d8"/><text x="319" y="139" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">2</text>
<text x="336" y="140" font-size="11.5" font-weight="600" fill="#3f4650">Tables</text>
<path d="M520 180h52" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
<path d="M568 171l10 9-10 9" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="546" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">jump</text>
<rect x="592" y="30" width="472" height="300" rx="18" fill="#ffffff" stroke="#e1e4ea" filter="url(#shadow)"/>
<text x="620" y="70" font-size="15" font-weight="700" fill="#1f2329">After</text><text x="620" y="90" font-size="11.5" fill="#8b919c">pin 2 jumped back</text>
<line x1="592" y1="108" x2="1064" y2="108" stroke="#eef0f4"/>
<rect x="610" y="124" width="426" height="62" rx="8" fill="#fff7e8"/><rect x="610" y="124" width="3" height="62" rx="1.5" fill="#f59e0b"/>
<rect x="584" y="144" width="22" height="22" rx="7" fill="#f59e0b"/><text x="595" y="159" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">2</text>
<text x="628" y="150" font-size="12.5" fill="#2b3038">Tables and code blocks work the same way.</text>
<text x="628" y="170" font-size="11.5" fill="#7b8290">The target block is now in view and flashes.</text>
<text x="620" y="222" font-size="12.5" fill="#5f6672">The panel closes. History is loaded only if needed.</text>
<text x="620" y="244" font-size="12.5" fill="#5f6672">Folded turns are opened before the scroll is verified.</text>
<text x="620" y="292" font-size="11.5" fill="#9aa1ad">On failure, the notice says whether the block is folded or missing.</text>
<text x="550" y="360" text-anchor="middle" font-size="10.5" fill="#9aa1ad">Clicking a pin never relies on one smooth scroll: the scroller is moved and the result is checked.</text>
</g>
</svg>
