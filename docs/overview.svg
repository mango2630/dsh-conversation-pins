<text x="338" y="100" font-size="13" fill="#8b919c">Trajectory</text>
<text x="968" y="60" font-size="18" fill="#8b919c">⋯</text><text x="994" y="60" font-size="18" fill="#8b919c">▢</text>
<rect x="558" y="78" width="248" height="36" rx="18" fill="#ffffff" stroke="#e3e6ec" filter="url(#soft)"/><circle cx="578" cy="96" r="5" fill="#f59e0b"/><text x="592" y="100" font-size="12" font-weight="600" fill="#3f4650">Pinned “Blocks”</text>
<rect x="654" y="142" width="332" height="56" rx="16" fill="#eef3ff"/><text x="674" y="166" font-size="12.5" fill="#2f3a4f">How do I keep track of a useful block</text><text x="674" y="184" font-size="12.5" fill="#2f3a4f">inside a very long answer?</text>
<text x="292" y="246" font-size="16" font-weight="700" fill="#1f2329">Keep a block one click away</text>
<text x="292" y="278" font-size="13.5" fill="#3f4650">Long answers are easier to revisit when a specific block stays</text>
<text x="292" y="299" font-size="13.5" fill="#3f4650">one click away.</text>
<rect x="282" y="324" width="694" height="66" rx="8" fill="#fff7e8"/><rect x="282" y="324" width="3" height="66" rx="1.5" fill="#f59e0b"/>
<text x="302" y="350" font-size="13.5" fill="#2b3038">Blocks can be pinned anywhere in a long answer —</text>
<text x="302" y="370" font-size="13.5" fill="#2b3038">paragraphs, headings, lists, code and tables.</text>
<rect x="252" y="340" width="22" height="22" rx="7" fill="#f59e0b"/><text x="263" y="355" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">1</text>
<text x="292" y="436" font-size="13.5" fill="#3f4650">The pin is labelled with the first six visible characters.</text>
<rect x="282" y="458" width="694" height="54" rx="8" fill="#fff7e8"/><rect x="282" y="458" width="3" height="54" rx="1.5" fill="#f59e0b"/>
<text x="302" y="482" font-size="13.5" fill="#2b3038">Tables and code blocks work the same way.</text>
<text x="302" y="501" font-size="12.5" fill="#6b7280">A subtle highlight keeps the spot visible while you scroll.</text>
<rect x="252" y="472" width="22" height="22" rx="7" fill="#f59e0b"/><text x="263" y="487" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">2</text>
<text x="292" y="554" font-size="13.5" fill="#3f4650">Open the pinboard from the top-right, then jump back at any time.</text>
<rect x="254" y="548" width="28" height="28" rx="9" fill="#fff7e8" stroke="#f0b95c" filter="url(#soft)"/>
<g transform="translate(260 554) scale(0.62)" color="#b45309"><path d="M9 3.5h6l-.9 4.7 3.4 3.7v2.3H6.5v-2.3l3.4-3.7L9 3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/><path d="M12 14.2v6.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g>
<path d="M278 580l0 18 5-5 4 8 5-2-4-8h7z" fill="#1f2329" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
<rect x="282" y="584" width="694" height="52" rx="8" fill="#f7f8fb"/>
<text x="302" y="608" font-size="12.5" fill="#7b8290">The target is unfolded, loaded if necessary, and scrolled into view.</text>
<text x="302" y="626" font-size="12.5" fill="#7b8290">If it cannot be shown, the plugin explains why.</text>
<rect x="1004" y="92" width="392" height="538" rx="20" fill="#ffffff" stroke="#e1e4ea" filter="url(#shadow)"/>
<rect x="1028" y="116" width="34" height="34" rx="10" fill="#fff7e8"/>
