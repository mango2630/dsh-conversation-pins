<rect x="36" y="88" width="196" height="38" rx="10" fill="#ffffff" stroke="#dde1e8"/><text x="134" y="112" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2d333d">+  New Session</text>
<text x="40" y="154" font-size="13" fill="#4b5563">◇</text><text x="62" y="154" font-size="13" fill="#4b5563">Plugins</text>
<text x="40" y="190" font-size="13" fill="#4b5563">◷</text><text x="62" y="190" font-size="13" fill="#4b5563">Automation tasks</text>
<text x="40" y="226" font-size="13" fill="#4b5563">⋯</text><text x="62" y="226" font-size="13" fill="#4b5563">More</text>
<text x="36" y="290" font-size="10.5" font-weight="700" letter-spacing="0.08em" fill="#9aa1ad">WORKSPACES</text>
