<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1b2433" flood-opacity="0.14"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1b2433" flood-opacity="0.10"/>
  </filter>
</defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
<rect width="1000" height="480" fill="#eef1f6"/>
<rect x="24" y="24" width="952" height="432" rx="22" fill="#ffffff" stroke="#e1e4ea" filter="url(#shadow)"/>
<text x="64" y="72" font-size="18" font-weight="700" fill="#1f2329">Hover, then move toward the pin</text>
<text x="64" y="96" font-size="12.5" fill="#7b8290">The button is attached to the text edge by an invisible bridge.</text>
<text x="190" y="176" font-size="14" fill="#3f4650">Hover any paragraph, heading, list, code block or table cell.</text>
<rect x="172" y="198" width="680" height="76" rx="10" fill="#fff7e8"/>
<rect x="172" y="198" width="4" height="76" rx="2" fill="#f59e0b"/>
<text x="196" y="228" font-size="14" fill="#2b3038">A pin appears in the left gutter — and stays there while</text>
<text x="196" y="250" font-size="14" fill="#2b3038">you move across the gutter to click it.</text>
<rect x="142" y="198" width="30" height="76" rx="8" fill="#fed7aa" opacity="0.55"/>
<rect x="146" y="226" width="26" height="26" rx="8" fill="#fff7e8" stroke="#f0b95c" filter="url(#soft)"/>
<g transform="translate(152 232) scale(0.6)" color="#b45309"><path d="M9 3.5h6l-.9 4.7 3.4 3.7v2.3H6.5v-2.3l3.4-3.7L9 3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/><path d="M12 14.2v6.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g>
<path d="M168 252l0 18 5-5 4 8 5-2-4-8h7z" fill="#1f2329" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
<path d="M172 220 C 162 220, 162 250, 172 250" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
<text x="108" y="318" font-size="11" fill="#b45309" font-weight="600">hover bridge</text>
<g>
<rect x="118" y="352" width="88" height="28" rx="8" fill="#ffffff" stroke="#dfe3ea"/>
<text x="162.0" y="370.5" text-anchor="middle" font-size="11.5" fill="#5f6672" font-weight="600">Alt + P</text>
</g>
<text x="220" y="371" font-size="12" fill="#5f6672">pin the hovered block without touching the button</text>
<text x="64" y="420" font-size="11" fill="#9aa1ad">Cursor arrow shown for position; the bridge is transparent in the real UI.</text>
</g>
</svg>
